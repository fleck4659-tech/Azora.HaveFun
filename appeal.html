<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azora Appeals</title>
    <link rel="stylesheet" href="appeal.css">
    <style>
        .appeal-link-blue { color: #2563eb; font-weight: 800; }
        .sys-note { background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 10px; padding: 10px 12px; font-size: 0.9rem; margin: 12px 0; }
        .ok { color: #047857; font-weight: 700; }
        .err { color: #b91c1c; font-weight: 700; }
    </style>
</head>
<body>
<div class="appeal-box">
    <img src="logo.jpg" class="logo" alt="Azora Logo">
    <h1>Azora Appeals</h1>
    <p class="welcome">Hello — appeals are reviewed by <strong>system</strong> (System Element · Aza: 2).</p>
    <div class="sys-note">
        Appeals are delivered to the <strong>system</strong> account inbox.
        System is not a real player — it is a <em>System Element</em> used for automated moderation routing.
    </div>
    <label for="appealUsername">Username</label>
    <input id="appealUsername" type="text" placeholder="Enter your username">
    <br><br>
    <label for="appealType">What are you appealing?</label>
    <select id="appealType">
        <option value="ban">Temporary Ban</option>
        <option value="termination">Termination</option>
    </select>
    <br><br>
    <label for="appealText">Your Appeal</label>
    <textarea id="appealText" rows="6" placeholder="Explain why this decision should be reviewed."></textarea>
    <br><br>
    <button type="button" onclick="submitAppeal()">Send Appeal to system</button>
    <p id="appealStatus" class="note"></p>
    <p class="note">Your appeal is attached to <strong>system</strong> (ID Aza: 2).</p>
</div>
<script>
(function () {
    try {
        var q = new URLSearchParams(location.search);
        var u = q.get("user") || q.get("username");
        var ty = q.get("type");
        if (u) document.getElementById("appealUsername").value = u;
        if (ty === "termination") document.getElementById("appealType").value = "termination";
        if (ty === "ban") document.getElementById("appealType").value = "ban";
    } catch (e) {}
})();

function submitAppeal() {
    var username = document.getElementById("appealUsername").value.trim();
    var type = document.getElementById("appealType").value;
    var text = document.getElementById("appealText").value.trim();
    var status = document.getElementById("appealStatus");
    if (!username) {
        status.className = "err";
        status.textContent = "Please enter your username.";
        return;
    }
    if (!text || text.length < 10) {
        status.className = "err";
        status.textContent = "Please write a more detailed appeal (at least 10 characters).";
        return;
    }
    var records;
    try { records = JSON.parse(localStorage.getItem("azoraModerationRecords") || "{}"); } catch (e) { records = {}; }
    if (!records.appeals) records.appeals = [];
    var entry = {
        id: "apl_" + Date.now(),
        username: username,
        type: type,
        text: text,
        at: Date.now(),
        to: "system",
        toUserId: "Aza: 2",
        status: "pending"
    };
    records.appeals.unshift(entry);
    // Also drop into system inbox
    if (!records.systemInbox) records.systemInbox = [];
    records.systemInbox.unshift({
        kind: "appeal",
        from: username,
        type: type,
        text: text,
        at: Date.now(),
        appealId: entry.id
    });
    localStorage.setItem("azoraModerationRecords", JSON.stringify(records));
    status.className = "ok";
    status.textContent = "Appeal sent to system (Aza: 2). It will be reviewed by automated moderation and staff tools.";
    document.getElementById("appealText").value = "";
}
</script>
</body>
</html>
